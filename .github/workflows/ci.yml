name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feat/tidal-alpha1-foundation]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, typecheck, format, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build frontend
        run: pnpm build

  rust:
    name: Rust (cargo check)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # We intentionally skip `pnpm tauri build` in CI for the foundation
      # release. A full Tauri build pulls platform-specific dependencies
      # (WebView2/NSIS on Windows, WebKitGTK on Linux) that are not yet
      # needed to validate the codebase. `pnpm build` already exercises
      # the frontend bundle and `cargo check --locked` validates the
      # Rust shell against the committed Cargo.lock.
      # Once a real desktop distribution pipeline is required, this job
      # grows a proper matrix with WebView2/NSIS on Windows and WebKitGTK
      # on Linux.

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      # Native packages required to compile `wry` / `tao` and their
      # transitive dependencies on Ubuntu. Tauri 2 links against
      # WebKitGTK API 4.1 (not 4.0), GTK 3 and the AppIndicator
      # library, so all of them must be available on the runner.
      - name: Install Tauri 2 system dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cargo check (locked)
        working-directory: src-tauri
        run: cargo check --locked